<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Ease - App Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #eef3f8;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Laptop presentation area */
        .presentation {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Mobile App Frame */
        .phone {
            width: 390px;
            height: 780px;

            background: #111;
            border-radius: 38px;

            padding: 10px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.25),
                0 5px 20px rgba(0,0,0,0.15);

            position: relative;
        }

        /* Top speaker / camera */
        .notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);

            width: 125px;
            height: 27px;

            background: #111;
            border-radius: 20px;

            z-index: 10;
        }

        /* Website screen */
        .screen {
            width: 100%;
            height: 100%;

            background: white;

            border-radius: 30px;
            overflow: hidden;

            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;

            border: none;

            background: white;
        }

        /* Home indicator */
        .home-bar {
            position: absolute;

            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);

            width: 110px;
            height: 5px;

            background: white;

            border-radius: 10px;

            z-index: 10;
        }

        /* App title */
        .title {
            position: fixed;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 22px;
            font-weight: bold;

            color: #1d4ed8;

            letter-spacing: 1px;
        }

        /* Laptop small screens */
        @media (max-width: 600px) {

            .presentation {
                padding: 15px;
            }

            .phone {
                width: 340px;
                height: 700px;
            }

            .title {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="title">
        Hire Ease
    </div>

    <div class="presentation">

        <div class="phone">

            <div class="notch"></div>

            <div class="screen">

                <!-- Your live Hire Ease website -->
                <iframe
                    src="https://mohamedirfan933.github.io/Hire-Ease/">
                </iframe>

            </div>

            <div class="home-bar"></div>

        </div>

    </div>

</body>
</html>
